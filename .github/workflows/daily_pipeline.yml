name: Market Risk Pipeline (manual)

# Daily schedule switched off to stay within Neon's free-tier storage.
# Run on demand from the Actions tab ("Run workflow").
on:
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest market data
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m src.data_pipeline.fetch_data

      - name: Run risk pipeline (VaR/CVaR, backtest, stress tests)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m src.risk_engine.run_risk_pipeline

# Setup notes:
# 1. Add one repository secret, DATABASE_URL, under Repo Settings -> Secrets and variables
#    -> Actions -> New repository secret
# 2. Get it from the Neon console: your project -> Connect -> connection string (pooled)
# 3. Test with workflow_dispatch (manual run button in the Actions tab) before relying on the cron schedule
